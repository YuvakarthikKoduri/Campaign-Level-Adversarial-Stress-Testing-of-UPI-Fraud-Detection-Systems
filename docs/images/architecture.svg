<title>Implemented UPI Fraud Stress Lab architecture</title>
<desc>Local dashboard submits allowlisted commands to existing Python engines. Engines use synthetic data and detectors and write immutable evidence. Independent verifiers and result parsers feed the dashboard and paper.</desc>
