<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="750" viewBox="0 0 720 500" role="img">
  <title>Academic prototype architecture with a shared simulator and training-only Q updates</title>
  <desc>A seeded runner configures attacker policies and the simulator. Transactions flow from policies to the simulator, which returns public feedback. Q learning updates occur in training only; frozen policies and simulator outcomes are saved as comparison evidence. Gate C is separate and not invoked.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1L8 5L1 9" fill="none" stroke="#64748b" stroke-width="1.5"/>
    </marker>
  </defs>
  <rect width="720" height="500" fill="#ffffff"/>
  <g fill="#f8fafc" stroke="#94a3b8" stroke-width="0.5">
    <rect x="235" y="20" width="250" height="65" rx="4"/>
    <rect x="40" y="155" width="260" height="120" rx="4"/>
    <rect x="420" y="155" width="260" height="120" rx="4"/>
    <rect x="40" y="355" width="260" height="100" rx="4" fill="#eff6ff" stroke="#2563eb"/>
    <rect x="420" y="355" width="260" height="100" rx="4"/>
  </g>
  <g fill="none" stroke="#64748b" stroke-width="1" marker-end="url(#arrow)">
    <path d="M360 85V115H170V155"/>
    <path d="M360 115H550V155"/>
    <path d="M300 194H420"/>
    <path d="M420 247H300"/>
    <path d="M170 275V355"/>
    <path d="M40 405H15V215H40"/>
    <path d="M550 275V355"/>
    <path d="M300 405H420"/>
  </g>
  <g font-family="Arial,sans-serif" fill="#172033" font-size="14">
    <text x="360" y="47" text-anchor="middle">Seeded experiment runner</text>
    <text x="360" y="68" text-anchor="middle" font-size="12">Paired workloads and configuration</text>
    <text x="170" y="185" text-anchor="middle">Attacker policies</text>
    <text x="170" y="208" text-anchor="middle" font-size="12">Static / rule-adaptive / RL</text>
    <text x="170" y="231" text-anchor="middle" font-size="12">Amount, pacing, recipient choice</text>
    <text x="170" y="254" text-anchor="middle" font-size="12">Untrained RL as an extra control</text>
    <text x="550" y="185" text-anchor="middle">Simulator and detectors</text>
    <text x="550" y="208" text-anchor="middle" font-size="12">XGBoost / Random Forest</text>
    <text x="550" y="231" text-anchor="middle" font-size="12">Feasibility, ledger, ALLOW/FLAG/BLOCK</text>
    <text x="550" y="254" text-anchor="middle" font-size="12">Existing campaign executor</text>
    <text x="170" y="383" text-anchor="middle">Tabular Q policy</text>
    <text x="170" y="407" text-anchor="middle" font-size="12">Training: reward and Q updates</text>
    <text x="170" y="431" text-anchor="middle" font-size="12">Evaluation: frozen Q, state feedback</text>
    <text x="550" y="383" text-anchor="middle">Evidence and comparison</text>
    <text x="550" y="407" text-anchor="middle" font-size="12">Per-seed metrics and transaction traces</text>
    <text x="550" y="431" text-anchor="middle" font-size="12">Policies, learning curves, tables, plots</text>
    <text x="360" y="182" text-anchor="middle" font-size="12">Action</text>
    <text x="360" y="235" text-anchor="middle" font-size="12">Public feedback</text>
    <text x="185" y="320" font-size="12">State and reward</text>
    <text x="565" y="320" font-size="12">Outcomes</text>
    <text x="360" y="393" text-anchor="middle" font-size="12">Policy JSON</text>
    <text x="360" y="483" text-anchor="middle" font-size="12">Independent academic development; held Gate C workflows are not invoked.</text>
  </g>
</svg>
